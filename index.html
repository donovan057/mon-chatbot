<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant IA</title>
    <!-- Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Highlight.js (Coloration Syntaxique) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-card">
        <!-- En-tête avec actions -->
        <header class="chat-header">
            <div class="header-left">
                <div class="avatar-container">
                    <div class="bot-avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                    <span class="status-dot"></span>
                </div>
                <div class="header-info">
                    <h3>Assistant IA</h3>
                    <p>En ligne • Modèle actif</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="new-chat-btn" title="Nouvelle conversation">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button id="theme-btn" title="Changer le thème">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Zone des messages -->
        <main class="chat-messages" id="chat-box">
            <div class="message bot">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="bubble-wrapper">
                    <div class="bubble">Bonjour ! Comment puis-je vous aider aujourd'hui ?</div>
                    <button class="copy-btn" title="Copier"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>
        </main>

        <!-- Zone de saisie -->
        <footer class="chat-footer">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Posez votre question..." autocomplete="off">
                <button id="send-btn" aria-label="Envoyer">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>

            <p class="chat-disclaimer">
                <i class="fa-solid fa-circle-info"></i> L'IA peut commettre des erreurs. Vérifiez les informations importantes.
            </p>
        </footer>
    </div>

    <!-- Librairies Externe : Marked (Markdown) + Highlight.js (Code) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
